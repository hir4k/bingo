[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bingo-framework"
version = "0.2.0"
description = "The opinionated Python web framework for the AI era."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "granian[reload]>=2.8,<3",
    "itsdangerous>=2.2",
    "jinja2>=3.1",
    "pydantic>=2.8",
    "python-multipart>=0.0.9",
    "rich>=13.7",
    "saq[redis]>=0.26,<0.27",
    "sqlalchemy[asyncio]>=2.0",
    "starlette>=0.38",
    "typer>=0.12",
]

[project.optional-dependencies]
postgres = [
    "psycopg[binary]>=3.2,<4",
    "saq[postgres]>=0.26,<0.27",
]
test = [
    "httpx>=0.27",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[project.scripts]
bingo = "bingo.cli.app:main"

[tool.hatch.build.targets.wheel]
packages = ["bingo"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"
